<!DOCTYPE html>
<html lang="es">

<head>
    <script src="/global-head.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, maximum-scale=1, user-scalable=no">
    <title>Chat Oficial - Cocacolalandia 26</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+New:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #0c0e1b;
            --card: #14172b;
            --accent: #00c6ff;
            --accent2: #bc13fe;
            --text: #ffffff;
            --font: 'Courier New', Courier, sans-serif;
        }

        body,
        html {
            min-height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            flex-direction: column;
            display: flex;
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            flex: 1;
            border-left: 1px solid rgba(0, 198, 255, 0.1);
            border-right: 1px solid rgba(0, 198, 255, 0.1);
            background: var(--bg);
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(12, 14, 27, 0.98);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .modal {
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid var(--accent);
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px var(--accent);
        }

        header {
            padding: 15px;
            background: var(--card);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--accent);
        }

        .user-info-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #my-pfp {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            object-fit: cover;
        }

        #login-btn,
        #logout-btn {
            background: linear-gradient(45deg, var(--accent), var(--accent2));
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-family: var(--font);
            font-size: 0.8rem;
            transition: transform 0.2s ease;
        }

        #login-btn:hover,
        #logout-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        #logout-btn {
            background: #222;
            border: 1px solid #444;
        }

        #chat-box {
            height: 70vh;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .msg {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            animation: slideUp 0.2s ease;
            position: relative;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg-img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 1px solid var(--accent);
            object-fit: cover;
        }

        .msg-img.owner-border {
            border: 2px solid #ff3333;
        }

        .msg-body {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 12px;
            border-bottom-left-radius: 2px;
            position: relative;
            min-width: 120px;
            word-break: break-word;
        }

        .msg-user {
            font-weight: 800;
            font-size: 0.8rem;
            display: block;
            margin-bottom: 3px;
        }

        .is-owner-text {
            color: #ff3333 !important;
            text-shadow: 0 0 5px rgba(255, 51, 51, 0.5);
        }

        .badge-owner {
            background: #ff3333;
            color: white;
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 4px;
            margin-left: 5px;
            font-weight: 800;
            vertical-align: middle;
        }

        .owner-icon {
            color: #ffcc00;
            margin-left: 3px;
        }

        .admin-tools {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            flex-direction: row;
            gap: 5px;
            z-index: 100;
        }

        .msg:hover .admin-tools {
            display: flex;
        }

        .btn-admin {
            background: #222;
            color: white;
            border: 1px solid #444;
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-admin:hover {
            background: #ff4444;
            border-color: white;
        }

        .input-wrap {
            padding: 20px;
            background: var(--card);
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        input[type="text"] {
            flex: 1;
            background: #000;
            border: 1px solid var(--accent);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-family: var(--font);
            outline: none;
        }

        button.send-v {
            background: linear-gradient(45deg, var(--accent), var(--accent2));
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-family: var(--font);
        }

        .verified-icon {
            color: var(--accent);
            font-size: 10px;
            margin-left: 4px;
        }

        .hidden {
            display: none !important;
        }

        /* TOAST */
        #toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast-msg {
            background: rgba(20, 23, 43, 0.95);
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            border-left: 4px solid var(--accent2);
            font-family: var(--font);
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5), 0 0 10px var(--accent2);
            animation: slideUpToast 0.4s ease forwards, fadeOutToast 0.4s ease 2.6s forwards;
            min-width: 200px;
            text-align: center;
        }

        @keyframes slideUpToast {
            from {
                transform: translateY(100px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeOutToast {
            to {
                transform: translateY(-20px);
                opacity: 0;
            }
        }

        button.send-v:disabled {
            background: #222 !important;
            color: #555 !important;
            cursor: not-allowed !important;
            box-shadow: none !important;
            transform: none !important;
            filter: grayscale(1);
        }

        /* Toast permanente de baneo */
        .toast-ban {
            border-left: 4px solid #ff3333 !important;
            box-shadow: 0 0 20px #ff3333 !important;
            animation: slideUpToast 0.4s ease forwards !important;
        }
    </style>
</head>

<body>

    <div id="step-age" class="overlay">
        <div class="modal">
            <i class="fa-solid fa-user-shield" style="font-size: 3rem; color: var(--accent2); margin-bottom: 15px;"></i>
            <h2>ACCESO +14 AÑOS</h2>
            <p>Confirma que tienes al menos 14 años para entrar al chat oficial de Cocacolalandia 26.</p>
            <button class="send-v" onclick="confirmAge()">SÍ, TENGO +14</button>
        </div>
    </div>

    <div id="step-guest-name" class="overlay hidden">
        <div class="modal">
            <h3>¿CÓMO TE LLAMAS?</h3>
            <p>Elige un apodo para chatear como invitado:</p>
            <input type="text" id="guest-input-name" placeholder="Escribe aquí..." maxlength="24" style="width:80%; margin-bottom:10px;">
            <p id="error-name" style="color: #ff4b4b; font-size: 0.8rem;" class="hidden">Ese nombre está reservado por el DUEÑO.</p>
            <button class="send-v" onclick="saveGuestName()">ENTRAR AL CHAT</button>
        </div>
    </div>

    <div id="step-profile" class="overlay hidden">
        <div class="modal">
            <h3>PERFIL VERIFICADO</h3>
            <p>Ajusta tu nombre y foto:</p>
            <input type="text" id="custom-name" placeholder="Tu nombre..." maxlength="24" style="width:80%; margin-bottom:10px;">
            <input type="text" id="custom-img" placeholder="URL de tu foto..." style="width:80%; margin-bottom:10px;">
            <button class="send-v" onclick="saveProfile()">GUARDAR Y ENTRAR</button>
        </div>
    </div>

    <div id="admin-confirm" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:100000; align-items:center; justify-content:center; backdrop-filter:blur(5px);">
        <div class="modal" style="border: 2px solid #ff3333; box-shadow: 0 0 20px #ff3333;">
            <h3 id="confirm-title" style="color:#ff3333;">ADVERTENCIA</h3>
            <p id="confirm-msg" style="margin-bottom:20px;"></p>
            <div style="display:flex; gap:10px; justify-content:center;">
                <button class="send-v" id="confirm-yes" style="background:#ff3333;">SÍ, CONFIRMAR</button>
                <button class="send-v" style="background:#444;" onclick="closeConfirm()">CANCELAR</button>
            </div>
        </div>
    </div>

    <div id="app">
        <header>
            <div class="user-info-bar">
                <img id="my-pfp" src="https://i.imgur.com/PPO7d2j.png" alt="">
                <span id="my-name">Cargando...</span>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="login-btn" onclick="startGoogle()"><i class="fab fa-google"></i> ENTRAR</button>
                <button id="logout-btn" class="hidden" onclick="closeSession()">SALIR</button>
            </div>
        </header>

        <div id="chat-box"></div>

        <div class="input-wrap">
            <input type="text" id="msg-input" placeholder="Escribe un mensaje..." maxlength="150">
            <button class="send-v" id="send-btn" onclick="trySend()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script type="module">
        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            getDatabase,
            ref,
            push,
            set,
            onValue,
            query,
            limitToLast,
            orderByChild,
            equalTo,
            limitToFirst,
            remove,
            get,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import {
            getAuth,
            signInWithPopup,
            GoogleAuthProvider,
            onAuthStateChanged,
            signOut,
            setPersistence,
            browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLaicFQIw-h7FLXXVi93jLQD4HggwejzI",
            authDomain: "cocacolalandia123.firebaseapp.com",
            // IMPORTANTE: copia aquí la URL exacta de tu Realtime Database
            // (Consola Firebase > Realtime Database). Si tu base está en Europa,
            // será del tipo https://cocacolalandia123-default-rtdb.europe-west1.firebasedatabase.app
            databaseURL: "https://cocacolalandia123-default-rtdb.firebaseio.com",
            projectId: "cocacolalandia123",
            storageBucket: "cocacolalandia123.firebasestorage.app",
            messagingSenderId: "196667615632",
            appId: "1:196667615632:web:53ec75c18ba83a91312b15"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const DEFAULT_PFP = "https://i.imgur.com/PPO7d2j.png";
        const MAX_VISIBLE = 20;
        const MAX_STORED = 50;

        /* =====================================================
           ID DE DISPOSITIVO (128 caracteres) - localStorage + cookie
           ===================================================== */
        const DEVICE_KEY = 'cc_device_id';
        const DEVICE_RE = /^[A-Za-z0-9_-]{128}$/;
        const FIVE_YEARS = 5 * 365 * 24 * 60 * 60; // segundos

        function generateDeviceId() {
            // Alfabeto de 64 caracteres: (byte & 63) no introduce sesgo.
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
            const bytes = new Uint8Array(128);
            window.crypto.getRandomValues(bytes);
            let id = '';
            for (let i = 0; i < 128; i++) id += alphabet[bytes[i] & 63];
            return id;
        }

        function readCookie(name) {
            const parts = document.cookie ? document.cookie.split('; ') : [];
            for (const p of parts) {
                const idx = p.indexOf('=');
                if (idx > -1 && p.slice(0, idx) === name) {
                    try {
                        return decodeURIComponent(p.slice(idx + 1));
                    } catch (e) {
                        return null;
                    }
                }
            }
            return null;
        }

        function writeCookie(name, value) {
            const secure = location.protocol === 'https:' ? '; Secure' : '';
            document.cookie = `${name}=${encodeURIComponent(value)}; max-age=${FIVE_YEARS}; path=/; SameSite=Lax${secure}`;
        }

        function persistDeviceId(id) {
            try {
                localStorage.setItem(DEVICE_KEY, id);
            } catch (e) {
                /* storage bloqueado */ }
            writeCookie(DEVICE_KEY, id); // también renueva la caducidad de 5 años
        }

        function getOrCreateDeviceId() {
            let fromLS = null;
            try {
                fromLS = localStorage.getItem(DEVICE_KEY);
            } catch (e) {}
            const fromCookie = readCookie(DEVICE_KEY);

            let id;
            if (DEVICE_RE.test(fromLS || '')) id = fromLS; // prioridad: localStorage
            else if (DEVICE_RE.test(fromCookie || '')) id = fromCookie; // autocuración desde cookie
            else id = generateDeviceId(); // solo si faltan ambos

            persistDeviceId(id); // restaura el que falte
            return id;
        }

        const myDeviceId = getOrCreateDeviceId();

        /* =====================================================
           UTILIDADES
           ===================================================== */
        function createToastContainer() {
            const c = document.createElement('div');
            c.id = 'toast-container';
            document.body.appendChild(c);
            return c;
        }

        // alert -> toast
        window.alert = function(message) {
            const container = document.getElementById('toast-container') || createToastContainer();
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        };

        function showPermanentBanToast(message) {
            const container = document.getElementById('toast-container') || createToastContainer();
            if (document.querySelector('.toast-ban')) return;
            const toast = document.createElement('div');
            toast.className = 'toast-msg toast-ban';
            toast.textContent = message;
            container.appendChild(toast);
        }

        function safeImageUrl(url) {
            try {
                const u = new URL(url, location.href);
                if (u.protocol === 'https:' || u.protocol === 'http:') return u.href;
            } catch (e) {}
            return DEFAULT_PFP;
        }

        /* =====================================================
           MODAL DE CONFIRMACIÓN (#admin-confirm)
           ===================================================== */
        let confirmAction = null;
        window.openConfirm = (title, msg, action) => {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-msg').textContent = msg;
            document.getElementById('admin-confirm').style.display = 'flex';
            confirmAction = action;
        };
        window.closeConfirm = () => {
            document.getElementById('admin-confirm').style.display = 'none';
            confirmAction = null;
        };
        document.getElementById('confirm-yes').onclick = () => {
            const action = confirmAction;
            closeConfirm();
            if (action) action();
        };

        /* =====================================================
           ESTADO DE USUARIO
           ===================================================== */
        let userData = {
            name: "Invitado",
            pfp: DEFAULT_PFP,
            isGoogle: false,
            isAdmin: false
        };

        function updateUI() {
            document.getElementById('my-name').textContent = userData.name;
            document.getElementById('my-pfp').src = safeImageUrl(userData.pfp);
        }

        /* =====================================================
           COMPROBACIÓN DE BANEO (get directo al deviceId)
           ===================================================== */
        let banLocked = false;

        function applyBanLock() {
            banLocked = true;
            const input = document.getElementById('msg-input');
            const btn = document.getElementById('send-btn');
            input.disabled = true;
            input.placeholder = "ACCESO RESTRINGIDO";
            btn.disabled = true;
            showPermanentBanToast("🚫 ESTÁS BANEADO. No puedes enviar mensajes.");
        }

        async function checkBanStatus() {
            if (banLocked) return true;
            try {
                const checks = [get(ref(db, 'banned_devices/' + myDeviceId))];
                if (auth.currentUser) checks.push(get(ref(db, 'banned_users/' + auth.currentUser.uid)));
                const results = await Promise.all(checks);
                if (results.some(s => s.exists())) {
                    applyBanLock();
                    return true;
                }
            } catch (e) {
                console.error("Error verificando baneo:", e);
            }
            return false;
        }

        /* =====================================================
           RENDER DEL CHAT (sin innerHTML -> sin XSS)
           ===================================================== */
        let cachedMsgs = []; // [{id, m}]

        function buildMessage(id, m) {
            const isOwner = m.isAdmin === true;

            const wrap = document.createElement('div');
            wrap.className = 'msg';

            const img = document.createElement('img');
            img.className = 'msg-img' + (isOwner ? ' owner-border' : '');
            img.src = safeImageUrl(m.pfp);
            img.alt = '';
            img.referrerPolicy = 'no-referrer';
            wrap.appendChild(img);

            const body = document.createElement('div');
            body.className = 'msg-body';

            const userSpan = document.createElement('span');
            userSpan.className = 'msg-user' + (isOwner ? ' is-owner-text' : '');
            userSpan.appendChild(document.createTextNode(String(m.user || 'Anónimo').slice(0, 30) + ' '));

            if (isOwner) {
                const crown = document.createElement('i');
                crown.className = 'fas fa-crown owner-icon';
                userSpan.appendChild(crown);
                userSpan.appendChild(document.createTextNode(' '));
                const badge = document.createElement('span');
                badge.className = 'badge-owner';
                badge.textContent = 'DUEÑO';
                userSpan.appendChild(badge);
            } else if (m.isGoogle) {
                const check = document.createElement('i');
                check.className = 'fas fa-check-circle verified-icon';
                userSpan.appendChild(check);
            }
            body.appendChild(userSpan);

            const textSpan = document.createElement('span');
            textSpan.textContent = String(m.text ?? '').slice(0, 150);
            body.appendChild(textSpan);
            wrap.appendChild(body);

            if (userData.isAdmin) {
                const tools = document.createElement('div');
                tools.className = 'admin-tools';

                const delBtn = document.createElement('button');
                delBtn.className = 'btn-admin';
                delBtn.textContent = 'Borrar';
                delBtn.addEventListener('click', () => delMsg(id));
                tools.appendChild(delBtn);

                if (!isOwner) {
                    const banBtn = document.createElement('button');
                    banBtn.className = 'btn-admin';
                    banBtn.textContent = 'Banear';
                    banBtn.addEventListener('click', () => banUser(m.deviceId, m.uid, m.user));
                    tools.appendChild(banBtn);
                }
                wrap.appendChild(tools);
            }

            return wrap;
        }

        function renderChat() {
            const box = document.getElementById('chat-box');
            const frag = document.createDocumentFragment();
            cachedMsgs.forEach(({
                id,
                m
            }) => frag.appendChild(buildMessage(id, m)));
            box.replaceChildren(frag);
            box.scrollTop = box.scrollHeight;
        }

        /* =====================================================
           SESIÓN / ADMIN
           ===================================================== */
        onAuthStateChanged(auth, async (user) => {
            const wasAdmin = userData.isAdmin;

            if (user) {
                try {
                    // Los administradores se registran por UID: /admins/<UID> = true
                    const adminSnap = await get(ref(db, 'admins/' + user.uid));
                    userData.isAdmin = adminSnap.exists();
                } catch (e) {
                    userData.isAdmin = false;
                }

                let saved = null;
                try {
                    saved = JSON.parse(localStorage.getItem('cc_profile_v3'));
                } catch (e) {}
                userData.name = (saved?.name || user.displayName || 'Usuario').slice(0, 24);
                userData.pfp = saved?.pfp || user.photoURL || DEFAULT_PFP;
                userData.isGoogle = true;

                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('logout-btn').classList.remove('hidden');
            } else {
                userData.isAdmin = false;
            }

            if (userData.isAdmin && !wasAdmin) alert("💻 MODO DUEÑO ACTIVADO");

            updateUI();
            // Redibujado inmediato al cambiar de rol (muestra/oculta Borrar y Banear)
            if (userData.isAdmin !== wasAdmin) renderChat();

            checkBanStatus();
        });

        window.startGoogle = async () => {
            try {
                await setPersistence(auth, browserLocalPersistence);
                const res = await signInWithPopup(auth, provider);
                document.getElementById('custom-name').value = res.user.displayName || '';
                document.getElementById('custom-img').value = res.user.photoURL || '';
                document.getElementById('step-profile').classList.remove('hidden');
            } catch (e) {
                if (e.code !== 'auth/popup-closed-by-user') alert("⚠️ No se pudo iniciar sesión.");
            }
        };

        window.saveProfile = () => {
            const name = document.getElementById('custom-name').value.trim().slice(0, 24);
            const pfp = document.getElementById('custom-img').value.trim();
            if (name) userData.name = name;
            userData.pfp = pfp ? safeImageUrl(pfp) : DEFAULT_PFP;
            try {
                localStorage.setItem('cc_profile_v3', JSON.stringify({
                    name: userData.name,
                    pfp: userData.pfp
                }));
            } catch (e) {}
            updateUI();
            document.getElementById('step-profile').classList.add('hidden');
        };

        window.closeSession = async () => {
            try {
                await signOut(auth);
            } catch (e) {}
            try {
                localStorage.removeItem('cc_profile_v3');
            } catch (e) {}
            location.reload();
        };

        /* =====================================================
           ENVÍO DE MENSAJES
           ===================================================== */
        window.trySend = async () => {
            if (banLocked) return;
            const val = document.getElementById('msg-input').value.trim();
            if (!val) return;

            if (!userData.isGoogle && userData.name === "Invitado") {
                document.getElementById('step-guest-name').classList.remove('hidden');
            } else {
                executeSend(val);
            }
        };

        window.saveGuestName = async () => {
            const n = document.getElementById('guest-input-name').value.trim().slice(0, 24);
            if (!n) return;

            try {
                // Nombre reservado si ya lo usa algún mensaje de administrador
                const snap = await get(query(ref(db, 'messages'), orderByChild('user'), equalTo(n), limitToFirst(25)));
                let reserved = false;
                snap.forEach(child => {
                    if (child.val().isAdmin === true) reserved = true;
                });
                // Además, comprobar los mensajes ya cargados en pantalla
                if (cachedMsgs.some(({
                        m
                    }) => m.isAdmin === true && String(m.user).toLowerCase() === n.toLowerCase())) reserved = true;

                if (reserved) {
                    document.getElementById('error-name').classList.remove('hidden');
                    return;
                }
            } catch (e) {
                console.warn("No se pudo comprobar el nombre reservado:", e);
            }

            userData.name = n;
            updateUI();
            document.getElementById('error-name').classList.add('hidden');
            document.getElementById('step-guest-name').classList.add('hidden');
            const val = document.getElementById('msg-input').value.trim();
            if (val) executeSend(val);
        };

        async function executeSend(text) {
            // Comprobación de baneo al vuelo antes de cada envío
            if (await checkBanStatus()) return;

            try {
                const msgRef = push(ref(db, 'messages'));
                await set(msgRef, {
                    text: text.slice(0, 150),
                    user: userData.name,
                    pfp: userData.pfp,
                    isGoogle: userData.isGoogle,
                    isAdmin: userData.isAdmin,
                    uid: auth.currentUser ? auth.currentUser.uid : "guest",
                    deviceId: myDeviceId,
                    time: serverTimestamp()
                });

                document.getElementById('msg-input').value = "";

                // Solo el administrador ejecuta la limpieza
                if (userData.isAdmin) cleanUp();

            } catch (e) {
                console.error("Error al enviar:", e);
                if (e.code === 'PERMISSION_DENIED' || String(e.message).includes('PERMISSION_DENIED')) {
                    applyBanLock();
                } else {
                    alert("⚠️ Error al enviar el mensaje. Revisa tu conexión.");
                }
            }
        }

        /* =====================================================
           LIMPIEZA (solo admin, secuencial)
           ===================================================== */
        let cleaning = false;
        async function cleanUp() {
            if (!userData.isAdmin || cleaning) return;
            cleaning = true;
            try {
                const snap = await get(ref(db, 'messages'));
                if (!snap.exists()) return;

                const keys = [];
                snap.forEach(child => {
                    keys.push(child.key);
                }); // claves push = orden cronológico

                if (keys.length > MAX_STORED) {
                    const toDelete = keys.slice(0, keys.length - MAX_VISIBLE);
                    for (const key of toDelete) {
                        await remove(ref(db, 'messages/' + key)); // uno a uno, sin saturar
                    }
                }
            } catch (e) {
                console.error("Error en cleanUp:", e);
            } finally {
                cleaning = false;
            }
        }

        /* =====================================================
           HERRAMIENTAS ADMIN
           ===================================================== */
        function delMsg(id) {
            openConfirm("BORRAR", "¿Quieres eliminar este mensaje?", async () => {
                try {
                    await remove(ref(db, 'messages/' + id));
                    alert("Mensaje eliminado");
                } catch (e) {
                    alert("⚠️ No se pudo eliminar el mensaje.");
                }
            });
        }

        function banUser(deviceId, uid, name) {
            if (!userData.isAdmin) return;

            if (!DEVICE_RE.test(deviceId || '')) {
                alert("Este mensaje no tiene un ID de dispositivo válido.");
                return;
            }
            if (deviceId === myDeviceId) {
                alert("No puedes banear tu propio dispositivo.");
                return;
            }

            openConfirm("BANEAR", `¿Seguro que quieres banear a "${String(name || 'este usuario').slice(0, 30)}"?`, async () => {
                try {
                    await set(ref(db, 'banned_devices/' + deviceId), {
                        banned: true,
                        time: serverTimestamp()
                    });

                    if (uid && uid !== "guest") {
                        await set(ref(db, 'banned_users/' + uid), {
                            banned: true,
                            time: serverTimestamp()
                        });
                    }
                    alert("Dispositivo baneado correctamente.");
                } catch (e) {
                    console.error(e);
                    alert("⚠️ No se pudo completar el baneo.");
                }
            });
        }

        /* =====================================================
           ESCUCHA EN TIEMPO REAL (últimos 20 mensajes)
           ===================================================== */
        const messagesQuery = query(ref(db, 'messages'), limitToLast(MAX_VISIBLE));
        onValue(messagesQuery, (snap) => {
            const arr = [];
            snap.forEach(child => {
                const m = child.val();
                if (m && typeof m === 'object') arr.push({
                    id: child.key,
                    m
                });
            });
            cachedMsgs = arr;
            renderChat();
        }, (err) => {
            console.error("Error en la escucha:", err);
        });

        /* =====================================================
           EDAD / ENTER / ARRANQUE
           ===================================================== */
        window.confirmAge = () => {
            document.getElementById('step-age').classList.add('hidden');
            try {
                localStorage.setItem('age_ok_cc', '1');
            } catch (e) {}
        };
        try {
            if (localStorage.getItem('age_ok_cc')) document.getElementById('step-age').classList.add('hidden');
        } catch (e) {}

        document.getElementById('msg-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') window.trySend();
        });

        updateUI();
        checkBanStatus();
    </script>
</body>

</html>
